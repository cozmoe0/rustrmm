<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">RustRMM</title>
  <desc id="desc">Self-hosted remote monitoring and management for MSPs, written in Rust. A central server connected to Windows, macOS, Linux and SNMP devices.</desc>
  <style>
    .sans { font-family: Inter, "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Mono", SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: reduce) { .pkt, .pulse { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161B"/>
      <stop offset="1" stop-color="#090B0E"/>
    </linearGradient>
    <radialGradient id="glowCopper" cx="0.12" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#E07444" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#E07444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPatina" cx="0.78" cy="0.55" r="0.42">
      <stop offset="0" stop-color="#3FC1B0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3FC1B0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#090B0E" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#090B0E" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#090B0E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FC1B0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#3FC1B0" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
    <g id="node">
      <rect x="-30" y="-30" width="60" height="60" rx="14" fill="#151A21" stroke="#FFFFFF" stroke-opacity="0.10"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#fadeGrid)"/>
    <rect width="1280" height="420" fill="url(#glowCopper)"/>
    <rect width="1280" height="420" fill="url(#glowPatina)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Wordmark -->
  <g transform="translate(72 74)">
    <rect width="60" height="60" rx="14" fill="#14171C" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <g transform="scale(1.875)">
      <path d="M9 22V10h7.2c2.9 0 4.8 1.7 4.8 4.2 0 1.900-1.1 3.300-2.9 3.900L21.6 22h-3.4l-3.1-3.6H12.1V22zm3.1-6.3h3.9c1.2 0 1.9-.6 1.9-1.6s-.7-1.6-1.900-1.600h-3.9z" fill="#E07444"/>
      <circle cx="24" cy="9" r="2.5" fill="#3FC1B0"/>
    </g>
  </g>
  <text x="150" y="121" class="sans" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#F3F3F1">Rust<tspan fill="#E07444">RMM</tspan></text>

  <g class="mono" font-size="12.5" letter-spacing="1.6" fill="#8D949D">
    <circle cx="78" cy="176" r="4" fill="#3FC1B0"/>
    <text x="92" y="180">SELF-HOSTED REMOTE MONITORING &amp; MANAGEMENT</text>
  </g>

  <text class="sans" font-size="36" font-weight="650" letter-spacing="-0.8" fill="#F3F3F1">
    <tspan x="72" y="228">Every endpoint, every client,</tspan>
    <tspan x="72" y="272" fill="#E07444">one calm console.</tspan>
  </text>

  <text class="sans" font-size="17" fill="#A3A9B1">
    <tspan x="72" y="314">Monitoring, remote control, automation, patching and ticketing</tspan>
    <tspan x="72" y="338">for Windows, macOS and Linux, in one Rust binary you host yourself.</tspan>
  </text>

  <!-- Chips -->
  <g class="sans" font-size="13" font-weight="550">
    <g transform="translate(72 362)">
      <rect width="112" height="30" rx="15" fill="#E07444" fill-opacity="0.12" stroke="#E07444" stroke-opacity="0.45"/>
      <text x="56" y="20" text-anchor="middle" fill="#F0A47F">Written in Rust</text>
    </g>
    <g transform="translate(194 362)">
      <rect width="128" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="64" y="20" text-anchor="middle" fill="#D5D8DC">MFA everywhere</text>
    </g>
    <g transform="translate(332 362)">
      <rect width="140" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="70" y="20" text-anchor="middle" fill="#D5D8DC">Signed commands</text>
    </g>
    <g transform="translate(482 362)">
      <rect width="138" height="30" rx="15" fill="#3FC1B0" fill-opacity="0.10" stroke="#3FC1B0" stroke-opacity="0.45"/>
      <text x="69" y="20" text-anchor="middle" fill="#7FD9CC">Docker or native</text>
    </g>
  </g>

  <!-- Fleet illustration -->
  <g transform="translate(990 214)">
    <circle r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <circle r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-dasharray="3 7"/>
    <circle class="pulse" r="60" fill="none" stroke="#3FC1B0" stroke-opacity="0.35">
      <animate attributeName="r" values="52;150" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- links (hub at 0,0) -->
    <g stroke-width="1.5" fill="none">
      <path id="l1" d="M-142 -118 L0 0" stroke="#3FC1B0" stroke-opacity="0.35"/>
      <path id="l2" d="M146 -122 L0 0" stroke="#3FC1B0" stroke-opacity="0.35"/>
      <path id="l3" d="M196 16 L0 0" stroke="#E07444" stroke-opacity="0.45"/>
      <path id="l4" d="M132 130 L0 0" stroke="#3FC1B0" stroke-opacity="0.35"/>
      <path id="l5" d="M-132 128 L0 0" stroke="#3FC1B0" stroke-opacity="0.35" stroke-dasharray="4 5"/>
      <path id="l6" d="M-204 4 L0 0" stroke="#3FC1B0" stroke-opacity="0.35"/>
    </g>

    <!-- packets -->
    <g class="pkt">
      <circle r="3" fill="#7FD9CC"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
      <circle r="3" fill="#7FD9CC"><animateMotion dur="3.1s" begin="0.8s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion></circle>
      <circle r="3.2" fill="#F0A47F"><animateMotion dur="2.2s" begin="0.3s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
      <circle r="3" fill="#7FD9CC"><animateMotion dur="2.9s" begin="1.4s" repeatCount="indefinite"><mpath href="#l4"/></animateMotion></circle>
      <circle r="3" fill="#7FD9CC"><animateMotion dur="3.4s" begin="0.5s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>
      <circle r="3" fill="#7FD9CC"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#l6"/></animateMotion></circle>
    </g>

    <!-- hub -->
    <rect x="-44" y="-44" width="88" height="88" rx="22" fill="#14171C" stroke="#E07444" stroke-opacity="0.55" stroke-width="1.5"/>
    <g transform="translate(-30 -30) scale(1.875)">
      <path d="M9 22V10h7.2c2.9 0 4.8 1.7 4.8 4.2 0 1.900-1.1 3.300-2.9 3.900L21.6 22h-3.4l-3.1-3.6H12.1V22zm3.1-6.3h3.9c1.2 0 1.9-.6 1.9-1.6s-.7-1.6-1.900-1.600h-3.9z" fill="#E07444"/>
      <circle cx="24" cy="9" r="2.5" fill="#3FC1B0"/>
    </g>

    <!-- nodes -->
    <g fill="none" stroke="#C9CED5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- 1 Windows desktop -->
      <g transform="translate(-142 -118)">
        <use href="#node"/>
        <rect x="-13" y="-11" width="26" height="17" rx="2"/>
        <path d="M-5 11h10M0 6v5"/>
        <circle cx="24" cy="-24" r="4.5" fill="#3FC1B0" stroke="#0C0E11" stroke-width="2"/>
      </g>
      <!-- 2 server -->
      <g transform="translate(146 -122)">
        <use href="#node"/>
        <rect x="-12" y="-13" width="24" height="10" rx="2"/>
        <rect x="-12" y="1" width="24" height="10" rx="2"/>
        <path d="M-7 -8h2M-7 6h2"/>
        <circle cx="24" cy="-24" r="4.5" fill="#3FC1B0" stroke="#0C0E11" stroke-width="2"/>
      </g>
      <!-- 3 laptop (warning) -->
      <g transform="translate(196 16)">
        <use href="#node"/>
        <rect x="-11" y="-10" width="22" height="14" rx="2"/>
        <path d="M-15 9h30"/>
        <circle cx="24" cy="-24" r="4.5" fill="#E07444" stroke="#0C0E11" stroke-width="2"/>
      </g>
      <!-- 4 linux server -->
      <g transform="translate(132 130)">
        <use href="#node"/>
        <path d="M-12 -10h24v20h-24z"/>
        <path d="M-7 -3l4 3-4 3M1 4h6"/>
        <circle cx="24" cy="-24" r="4.5" fill="#3FC1B0" stroke="#0C0E11" stroke-width="2"/>
      </g>
      <!-- 5 network switch (SNMP) -->
      <g transform="translate(-132 128)">
        <use href="#node"/>
        <rect x="-14" y="-7" width="28" height="14" rx="2"/>
        <path d="M-9 0h1M-4 0h1M1 0h1M6 0h1"/>
        <circle cx="24" cy="-24" r="4.5" fill="#3FC1B0" stroke="#0C0E11" stroke-width="2"/>
      </g>
      <!-- 6 laptop -->
      <g transform="translate(-204 4)">
        <use href="#node"/>
        <rect x="-11" y="-10" width="22" height="14" rx="2"/>
        <path d="M-15 9h30"/>
        <circle cx="24" cy="-24" r="4.5" fill="#3FC1B0" stroke="#0C0E11" stroke-width="2"/>
      </g>
    </g>

    <!-- node labels -->
    <g class="mono" font-size="11" fill="#8D949D" text-anchor="middle">
      <text x="-142" y="-74">NWD-FRONT-01</text>
      <text x="146" y="-78">SF-HQ-DC01</text>
      <text x="196" y="60">mbp-ines</text>
      <text x="132" y="174">sf-wms-01</text>
      <text x="-132" y="172">core-switch</text>
      <text x="-204" y="48">HPL-LT-07</text>
    </g>
  </g>
</svg>
