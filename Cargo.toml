[workspace]
resolver = "3"
members = ["crates/*"]
# Phase-0 spikes are standalone throwaway crates; fuzz/ is the cargo-fuzz crate (nightly).
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
repository = "https://github.com/rustrmm/rustrmm"

[workspace.dependencies]
# Internal crates
rustrmm-common = { path = "crates/common" }
rustrmm-crypto = { path = "crates/crypto" }
rustrmm-proto = { path = "crates/proto" }

# Core
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
url = { version = "2", features = ["serde"] }
dashmap = "6"
arc-swap = "1"
ipnet = { version = "2", features = ["serde"] }
tempfile = "3"

# Encoding
base64 = "0.23"
hex = "0.4"
data-encoding = "2"

# Crypto
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
argon2 = "0.6"
age = "0.12"
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# Protocol / agent
rmp-serde = "1.3"
serde_bytes = "0.11"
sysinfo = "0.40"
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls-platform-verifier = "0.7"
hostname = "0.4"
windows-service = "0.8"
wmi = "0.18"
winreg = "0.56"
windows = "0.62"

# Server
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br", "trace", "timeout", "limit", "set-header", "catch-panic"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
sha1 = "0.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }
croner = "4"
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
zstd = "0.14"
tar = "0.4"
# S3 backups. `aws-base` + `ring` instead of `aws` keeps aws-lc-rs (C/assembly, cmake) out of the
# tree: SigV4 signing uses ring, and the HTTP client is the workspace reqwest (rustls with the ring
# provider via feature unification with `rustls-no-provider`).
object_store = { version = "0.14", default-features = false, features = ["aws-base", "ring", "reqwest"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Ticketing: Markdown rendering for e-mail (always sanitised), inbound MIME parsing.
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
ammonia = "=4.2.5"
mail-parser = "1.0.1"
# Phase 11: OpenAPI generation, PDF reports, SVG sanitising, JWT/JWKS verification (ring is
# already the rustls provider), PNG re-encoding for PDF logos.
utoipa = { version = "6.0.0", features = ["chrono"] }
pdf-writer = "0.15.0"
roxmltree = "0.21.2"
ring = "0.17.14"
flate2 = "1.1.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
# Keep dependencies reasonably fast in debug builds (argon2, zstd, sqlite).
opt-level = 2

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
