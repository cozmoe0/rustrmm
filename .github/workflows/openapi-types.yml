name: OpenAPI console types

# Freshness check for the console's generated API types: builds the server, starts it with a
# throw-away data directory, downloads GET /api/openapi.json and compares it (and the types
# generated from it) with the committed web/openapi.json and web/src/lib/api/openapi.gen.ts.
#
# Bootstrap: until both files are committed the job only warns and uploads the freshly generated
# files as an artifact; commit them (or run `npm run gen:api -- --from <server>/api/openapi.json
# --save` locally) to turn the check into a hard failure on drift.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/server/**'
      - 'crates/common/**'
      - 'web/openapi.json'
      - 'web/src/lib/api/openapi.gen.ts'
      - 'web/scripts/gen-api.mjs'
      - 'web/package.json'
      - 'web/package-lock.json'
      - '.github/workflows/openapi-types.yml'

permissions:
  contents: read

concurrency:
  group: openapi-types-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  openapi-types:
    name: Generated types are fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the server
        run: cargo build -p rustrmm-server
      - name: Start the server (dev mode, temporary data directory)
        run: |
          mkdir -p "$RUNNER_TEMP/rustrmm-data"
          ./target/debug/rustrmm-server --data-dir "$RUNNER_TEMP/rustrmm-data" --dev \
            --console-bind 127.0.0.1:8443 --agent-bind 127.0.0.1:8444 > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -skf https://localhost:8443/api/openapi.json -o /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::The server did not serve /api/openapi.json within 60 seconds"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: Install console dependencies
        working-directory: web
        run: npm ci
      - name: Compare snapshot and generated types
        working-directory: web
        env:
          # The dev server uses a self-signed certificate; this only affects the download.
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm run gen:api -- --from https://localhost:8443/api/openapi.json --check
      - name: Typecheck the console with the generated types
        working-directory: web
        run: npm run typecheck
      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-console-types
          path: |
            web/openapi.json
            web/src/lib/api/openapi.gen.ts
          if-no-files-found: ignore
