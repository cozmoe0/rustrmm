[package]
name = "rustrmm-server"
description = "RustRMM server: web console, REST API and agent gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "rustrmm-server"

[[bin]]
name = "rustrmm-server"
path = "src/main.rs"

[dependencies]
rustrmm-common.workspace = true
rustrmm-crypto.workspace = true
rustrmm-proto.workspace = true
rmp-serde.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
bytes.workspace = true
tracing.workspace = true
clap.workspace = true
uuid.workspace = true
chrono.workspace = true
url.workspace = true
dashmap.workspace = true
arc-swap.workspace = true
ipnet.workspace = true
tempfile.workspace = true
time = "0.3"

base64.workspace = true
hex.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
zeroize.workspace = true
subtle.workspace = true
sha2.workspace = true
hmac.workspace = true
argon2.workspace = true
age.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
rustls-platform-verifier.workspace = true
# Outbound webhooks only, always through monitoring::notify::ssrf (ring provider, pinned DNS).
reqwest.workspace = true

axum = { workspace = true, features = ["multipart"] }
axum-extra.workspace = true
axum-server.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
sha1.workspace = true
qrcode.workspace = true
webauthn-rs.workspace = true
croner.workspace = true
chrono-tz.workspace = true
regex.workspace = true
zstd.workspace = true
tar.workspace = true
object_store.workspace = true
zip.workspace = true
pulldown-cmark.workspace = true
ammonia.workspace = true
mail-parser.workspace = true
utoipa.workspace = true
pdf-writer.workspace = true
roxmltree.workspace = true
ring.workspace = true
flate2.workspace = true
# Settings -> Code signing: Authenticode/CMS signer certificates, MSI compound files.
x509-parser.workspace = true
cfb = "0.16"

[dev-dependencies]
rustrmm-proto = { workspace = true, features = ["tungstenite"] }
http-body-util = "0.1"
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
