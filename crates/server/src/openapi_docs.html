<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RustRMM API</title>
<style>
:root{--bg:#0c0e11;--panel:#13161b;--line:#232830;--ink:#e7e9ee;--muted:#9aa1ad;--accent:#e0703f;--get:#3b82f6;--post:#22a06b;--put:#d97706;--patch:#a855f7;--delete:#dc2626}
@media (prefers-color-scheme: light){:root{--bg:#f7f7f8;--panel:#fff;--line:#e3e5e8;--ink:#15171a;--muted:#5c6370}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;gap:16px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;color:var(--accent)}header input{flex:1;max-width:420px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
header a{color:var(--muted);font-size:13px}
.wrap{display:flex;min-height:calc(100vh - 54px)}nav{width:240px;flex:none;border-right:1px solid var(--line);padding:12px 0;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
nav a{display:block;padding:4px 20px;color:var(--muted);text-decoration:none;font-size:13px}nav a:hover{color:var(--ink)}
main{flex:1;padding:16px 28px;min-width:0}h2{font-size:18px;margin:28px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:8px 0}summary{cursor:pointer;padding:8px 12px;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}.m{font:600 11px/1 ui-monospace,monospace;text-transform:uppercase;padding:4px 6px;border-radius:4px;color:#fff;min-width:56px;text-align:center}
.get{background:var(--get)}.post{background:var(--post)}.put{background:var(--put)}.patch{background:var(--patch)}.delete{background:var(--delete)}
code,.p{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.s{color:var(--muted)}.body{padding:4px 14px 12px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;margin:6px 0 10px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:4px 8px;vertical-align:top;font-size:13px}th{color:var(--muted);font-weight:500}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;font-size:12px;max-height:360px}.lock{font-size:11px;color:var(--muted)}
@media (max-width:760px){nav{display:none}main{padding:12px 16px}}
</style>
</head>
<body>
<header><h1>RustRMM API</h1><input id="q" type="search" placeholder="Filter by path, summary or tag" autocomplete="off"><a href="/api/openapi.json">openapi.json</a></header>
<div class="wrap"><nav id="nav"></nav><main id="main"><p class="s">Loading the API description…</p></main></div>
<script src="/api/docs/app.js"></script>
</body>
</html>
