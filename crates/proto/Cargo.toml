[package]
name = "rustrmm-proto"
description = "RustRMM agent <-> server wire protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rustrmm-crypto.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
rmp-serde.workspace = true
zstd.workspace = true
thiserror.workspace = true
base64.workspace = true
url.workspace = true
futures.workspace = true
zeroize.workspace = true
# Noise IK end-to-end channel: pure-Rust resolver (ChaCha20-Poly1305, BLAKE2s, X25519), no OpenSSL.
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
# X25519 public key from a stored secret (the same curve25519-dalek release snow uses).
curve25519-dalek = { version = "5.0.0", default-features = false }
# Optional WebSocket adapter for the agent, the simulator and tests.
tokio-tungstenite = { workspace = true, optional = true }

[features]
tungstenite = ["dep:tokio-tungstenite"]

[lints]
workspace = true
