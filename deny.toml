# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Every ignore needs a written justification and is reviewed when the dependency moves.
ignore = [
  # rsa (Marvin attack, timing side channel on private-key operations). Pulled in by
  # webauthn-rs 0.6 (crypto-glue pins rsa 0.10.0-rc.19 with a feature 0.10.0 dropped, so no
  # upgrade is possible yet). We only *verify* RSA passkey signatures/attestations with public
  # keys; no RSA private key exists in the process, so the side channel has nothing to leak.
  { id = "RUSTSEC-2023-0071", reason = "webauthn-rs uses rsa for public-key verification only; no private-key operations" },
  # crypto-bigint 0.5 (timing variability in constant-time ops). Reached through age 0.12 ->
  # p256/hpke (P-256 tag recipients). RustRMM uses age only with X25519 recipients/identities
  # (escrow and backups), so no secret ever flows through crypto-bigint; the fix exists only in
  # the 0.7 line, which age has not adopted yet.
  { id = "RUSTSEC-2026-0387", reason = "only reachable via age's P-256 recipients, which RustRMM never uses" },
  # basic-toml is unmaintained (no vulnerability). It parses age's i18n.toml at compile time
  # inside the i18n-embed proc macros; nothing reads TOML at run time through it.
  { id = "RUSTSEC-2026-0374", reason = "unmaintained only; compile-time use by age's localisation macros" },
  # humantime is unmaintained (no vulnerability). object_store uses it to parse duration
  # strings in its configuration; RustRMM sets every option through typed builder methods.
  { id = "RUSTSEC-2026-0542", reason = "unmaintained only; object_store config parsing, no untrusted input" },
  # chrono / chrono-tz are unmaintained (no vulnerability). They are used for timestamps and
  # schedule time zones throughout (also by sqlx, croner and object_store); replacing them is
  # tracked in docs/roadmap.md. No safe upgrade exists.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained only; no replacement shared by sqlx/croner/object_store yet" },
  { id = "RUSTSEC-2026-0555", reason = "unmaintained only; used with the bundled IANA database for schedule time zones" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]

# Workspace crates are `publish = false` (workspace.package) and carry no licence of their own.
[licenses.private]
ignore = true

[[licenses.exceptions]]
# jpeg-encoder contains code derived from libjpeg (Independent JPEG Group licence: permissive,
# requires an acknowledgement in the documentation: README.md, Acknowledgements). Used by
# the agent only, for remote desktop tiles.
crate = "jpeg-encoder"
allow = ["IJG"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# aws-lc-rs (C/assembly, cmake toolchain) must stay out: rustls and object_store use ring.
deny = [
  { crate = "aws-lc-rs", reason = "ring is the only crypto provider (rustls, object_store)" },
  { crate = "aws-lc-sys", reason = "ring is the only crypto provider (rustls, object_store)" },
  { crate = "openssl-sys", reason = "no OpenSSL anywhere (rustls, ring, pure-Rust Noise)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
