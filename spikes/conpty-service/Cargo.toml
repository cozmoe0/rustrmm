[package]
name = "conpty-service-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase-0 throwaway spike: host an interactive shell from a Windows LocalSystem service via a hand-written ConPTY host"

# Standalone throwaway crate. The empty table keeps it out of the root Cargo workspace.
[workspace]

[dependencies]
anyhow = "1"
windows-service = "0.8.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]
